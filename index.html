<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Gran Carrera 3D: Kairos, Lápiz y Tornituerqui</title>
    <meta name="description" content="Videojuego de carreras 3D en pantalla dividida con Kairos, Lápiz y Tornituerqui.">
    <link rel="stylesheet" href="style.css">
    <!-- Local Three.js and GLTFLoader libraries -->
    <script src="three.min.js"></script>
    <script src="GLTFLoader.js"></script>
</head>
<body>
    <!-- Main 3D WebGL Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Split Screen Center Divider (Visible during 2P racing) -->
    <div id="split-screen-divider" class="split-divider hidden"></div>

    <!-- UI Overlay Layer -->
    <div class="ui-layer" id="game-ui">

        <!-- Top Status Bar -->
        <div class="top-bar">
            <button id="btn-sound" class="btn-sound-toggle clickable" aria-label="Activar o silenciar sonido">
                🔊 Sonido
            </button>
            <div id="hud-cup-title" class="cup-badge">Copa Pueblo Costero</div>
        </div>

        <!-- In-Game Split HUD -->
        <div id="game-hud" class="hud-split-container hidden">
            <!-- P1 HUD (Left Viewport) -->
            <div class="hud-player-panel hud-p1">
                <div class="hud-header">
                    <span class="player-tag tag-p1">P1 (WASD)</span>
                    <span id="hud-p1-rank" class="rank-badge">1°</span>
                    <span id="hud-p1-lap" class="lap-badge">Vuelta 1/3</span>
                </div>
                <div class="speed-container">
                    <div class="speed-bar-track">
                        <div id="speed-bar-p1" class="speed-bar-fill fill-p1"></div>
                    </div>
                </div>
                <!-- On-Screen Controls P1 -->
                <div class="touch-controls p1-touch">
                    <button id="p1-btn-left" class="touch-btn" title="Giro Izquierda">◀</button>
                    <button id="p1-btn-right" class="touch-btn" title="Giro Derecha">▶</button>
                    <button id="p1-btn-accel" class="touch-btn touch-accel" title="Acelerar">⚡</button>
                    <button id="p1-btn-boost" class="touch-btn touch-power" title="Turbo (Espacio o 1)">💨</button>
                    <button id="p1-btn-shield" class="touch-btn touch-power" title="Escudo (Q o 2)">🛡️</button>
                    <button id="p1-btn-jump" class="touch-btn touch-power" title="Salto (E o 3)">🌈</button>
                </div>
            </div>

            <!-- P2 HUD (Right Viewport) -->
            <div class="hud-player-panel hud-p2">
                <div class="hud-header">
                    <span class="player-tag tag-p2">P2 (Flechas)</span>
                    <span id="hud-p2-rank" class="rank-badge">2°</span>
                    <span id="hud-p2-lap" class="lap-badge">Vuelta 1/3</span>
                </div>
                <div class="speed-container">
                    <div class="speed-bar-track">
                        <div id="speed-bar-p2" class="speed-bar-fill fill-p2"></div>
                    </div>
                </div>
                <!-- On-Screen Controls P2 -->
                <div class="touch-controls p2-touch">
                    <button id="p2-btn-left" class="touch-btn" title="Giro Izquierda">◀</button>
                    <button id="p2-btn-right" class="touch-btn" title="Giro Derecha">▶</button>
                    <button id="p2-btn-accel" class="touch-btn touch-accel" title="Acelerar">⚡</button>
                    <button id="p2-btn-boost" class="touch-btn touch-power" title="Turbo (Enter o Num 1)">💨</button>
                    <button id="p2-btn-shield" class="touch-btn touch-power" title="Escudo (Shift o Num 2)">🛡️</button>
                    <button id="p2-btn-jump" class="touch-btn touch-power" title="Salto (Ctrl o Num 3)">🌈</button>
                </div>
            </div>
        </div>

        <!-- Title & Character Selection Screen -->
        <div id="title-screen" class="modal-screen clickable">
            <div class="dialog-box dialog-large">
                <h1 class="game-logo">La Gran Carrera 3D</h1>
                <p class="game-subtitle">Kairos, Lápiz y Tornituerqui: Gran Prix del Poblado</p>

                <!-- Mode Selection -->
                <div class="mode-selector">
                    <label class="mode-option active" id="mode-2p">
                        <input type="radio" name="playermode" value="2" checked>
                        <span>👥 2 Jugadores (Pantalla Dividida)</span>
                    </label>
                    <label class="mode-option" id="mode-1p">
                        <input type="radio" name="playermode" value="1">
                        <span>👤 1 Jugador (Pantalla Completa vs IA)</span>
                    </label>
                </div>

                <!-- Character Selection Grid -->
                <div class="selection-columns">
                    <!-- Player 1 Choice -->
                    <div class="player-select-card">
                        <h3>Barco de Jugador 1</h3>
                        <div class="char-options" id="p1-char-options">
                            <button class="char-btn active" data-model="kairos">
                                <span class="char-icon">⛵</span>
                                <span class="char-name">Kairos</span>
                                <span class="char-spec">Velero Ágil</span>
                            </button>
                            <button class="char-btn" data-model="lapiz">
                                <span class="char-icon">✏️</span>
                                <span class="char-name">Lápiz</span>
                                <span class="char-spec">Cohete Veloz</span>
                            </button>
                            <button class="char-btn" data-model="tornituerqui">
                                <span class="char-icon">⚙️</span>
                                <span class="char-name">Tornituerqui</span>
                                <span class="char-spec">Fuerza & Vapor</span>
                            </button>
                        </div>
                    </div>

                    <!-- Player 2 Choice -->
                    <div class="player-select-card" id="p2-select-container">
                        <h3>Barco de Jugador 2</h3>
                        <div class="char-options" id="p2-char-options">
                            <button class="char-btn" data-model="kairos">
                                <span class="char-icon">⛵</span>
                                <span class="char-name">Kairos</span>
                                <span class="char-spec">Velero Ágil</span>
                            </button>
                            <button class="char-btn active" data-model="lapiz">
                                <span class="char-icon">✏️</span>
                                <span class="char-name">Lápiz</span>
                                <span class="char-spec">Cohete Veloz</span>
                            </button>
                            <button class="char-btn" data-model="tornituerqui">
                                <span class="char-icon">⚙️</span>
                                <span class="char-name">Tornituerqui</span>
                                <span class="char-spec">Fuerza & Vapor</span>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="action-row">
                    <button id="btn-start-game" class="primary-btn">
                        🚀 ¡Comenzar Carrera!
                    </button>
                </div>
            </div>
        </div>

        <!-- Victory / Race Over Screen -->
        <div id="victory-screen" class="modal-screen clickable hidden">
            <div class="dialog-box">
                <div style="font-size: 50px; margin-bottom: 8px;">🏆🏁</div>
                <h2 id="victory-position" class="game-logo">¡Carrera Finalizada!</h2>
                <p id="victory-points" class="game-subtitle">Puntuaciones del Gran Prix</p>
                <div id="victory-desc" class="coop-info-card" style="text-align: center;">
                    Preparándose para el siguiente circuito...
                </div>

                <div class="action-row">
                    <button id="btn-play-again" class="primary-btn">
                        🚀 Siguiente Circuito
                    </button>
                    <button id="btn-menu-return" class="secondary-btn">
                        📋 Menú Principal
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="audio.js?v=8001"></script>
    <script src="game3d.js?v=8001"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnStart = document.getElementById('btn-start-game');
            const btnPlayAgain = document.getElementById('btn-play-again');
            const btnMenuReturn = document.getElementById('btn-menu-return');
            const btnSound = document.getElementById('btn-sound');
            const splitDivider = document.getElementById('split-screen-divider');

            // Sound Toggle
            if (btnSound) {
                btnSound.addEventListener('click', () => {
                    if (window.soundManager) {
                        window.soundManager.init();
                        const isMuted = window.soundManager.toggleMute();
                        btnSound.textContent = isMuted ? '🔇 Silenciado' : '🔊 Sonido';
                    }
                });
            }

            // Mode Selection
            const mode1p = document.getElementById('mode-1p');
            const mode2p = document.getElementById('mode-2p');
            const p2Container = document.getElementById('p2-select-container');

            if (mode1p && mode2p) {
                mode1p.addEventListener('click', () => {
                    mode1p.classList.add('active');
                    mode2p.classList.remove('active');
                    if (window.game3d) window.game3d.numPlayers = 1;
                    if (p2Container) p2Container.style.opacity = '0.45';
                    if (splitDivider) splitDivider.classList.add('hidden');
                });
                mode2p.addEventListener('click', () => {
                    mode2p.classList.add('active');
                    mode1p.classList.remove('active');
                    if (window.game3d) window.game3d.numPlayers = 2;
                    if (p2Container) p2Container.style.opacity = '1.0';
                    if (splitDivider) splitDivider.classList.remove('hidden');
                });
            }

            // Character buttons handler
            function setupCharButtons(containerId, onSelect) {
                const container = document.getElementById(containerId);
                if (!container) return;
                const buttons = container.querySelectorAll('.char-btn');
                buttons.forEach(btn => {
                    btn.addEventListener('click', () => {
                        buttons.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        onSelect(btn.getAttribute('data-model'));
                    });
                });
            }

            setupCharButtons('p1-char-options', (model) => {
                if (window.game3d) {
                    window.game3d.p1Model = model;
                    window.game3d.setupVehicles();
                }
            });

            setupCharButtons('p2-char-options', (model) => {
                if (window.game3d) {
                    window.game3d.p2Model = model;
                    window.game3d.setupVehicles();
                }
            });

            if (btnStart) {
                btnStart.addEventListener('click', () => {
                    if (window.game3d) {
                        if (window.game3d.numPlayers === 2 && splitDivider) {
                            splitDivider.classList.remove('hidden');
                        } else if (splitDivider) {
                            splitDivider.classList.add('hidden');
                        }
                        window.game3d.startRace();
                    }
                });
            }

            if (btnPlayAgain) {
                btnPlayAgain.addEventListener('click', () => {
                    if (window.game3d) {
                        window.game3d.advanceTournament();
                    }
                });
            }

            if (btnMenuReturn) {
                btnMenuReturn.addEventListener('click', () => {
                    document.getElementById('victory-screen').classList.add('hidden');
                    document.getElementById('title-screen').classList.remove('hidden');
                    if (splitDivider) splitDivider.classList.add('hidden');
                    if (window.game3d) window.game3d.gameState = 'menu';
                });
            }

            // Virtual / Touch input listeners
            const bindTouch = (id, prop) => {
                const el = document.getElementById(id);
                if (!el) return;
                const setVal = (v) => { if (window.game3d) window.game3d.virtualInputs[prop] = v; };
                el.addEventListener('pointerdown', (e) => { e.preventDefault(); setVal(true); });
                el.addEventListener('pointerup', (e) => { e.preventDefault(); setVal(false); });
                el.addEventListener('pointerleave', (e) => { e.preventDefault(); setVal(false); });
            };

            bindTouch('p1-btn-left', 'p1Left');
            bindTouch('p1-btn-right', 'p1Right');
            bindTouch('p1-btn-accel', 'p1Accel');
            bindTouch('p1-btn-boost', 'p1Boost');
            bindTouch('p1-btn-shield', 'p1Shield');
            bindTouch('p1-btn-jump', 'p1Jump');

            bindTouch('p2-btn-left', 'p2Left');
            bindTouch('p2-btn-right', 'p2Right');
            bindTouch('p2-btn-accel', 'p2Accel');
            bindTouch('p2-btn-boost', 'p2Boost');
            bindTouch('p2-btn-shield', 'p2Shield');
            bindTouch('p2-btn-jump', 'p2Jump');
        });
    </script>
</body>
</html>
